name: Windows Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PYTHONUTF8: '1'
      npm_config_logs_max: '0'
      npm_config_update_notifier: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate release tag and isolate fixtures
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -cne "v$version" -or $version -notmatch '^\d+\.\d+\.\d+$') { throw 'Tag must match the stable package version.' }
          # Keep fixture paths in the runner's native TEMP spelling (which can be an 8.3 alias).
          $root = Join-Path $env:TEMP "phuket-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          foreach ($entry in @{PHUKET_SWITCH_USER_HOME='home'; PHUKET_SWITCH_HOME='db'; PLUGIN_DATA='plugin-data'}.GetEnumerator()) {
            $dir = Join-Path $root $entry.Value
            New-Item -ItemType Directory -Force $dir | Out-Null
            "$($entry.Key)=$dir" >> $env:GITHUB_ENV
          }
      - run: npm ci
      - run: node scripts/api-contract.mjs --check
      - run: npm run typecheck
      - run: python -m py_compile subagent/astra_mcp_server.py
      - run: python -m unittest discover -s subagent -p "test_*.py" -v
      - run: npm test
      - name: Build Windows installers and update metadata
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish and verify a single GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $releaseTag = $env:RELEASE_TAG
          $version = $releaseTag.Substring(1)
          $assets = @(
            "release/Phuket.Switch.Setup.$version.exe"
            "release/Phuket.Switch.Setup.$version.exe.blockmap"
            'release/latest.yml'
            "release/Phuket.Switch.$version.exe"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Missing release file: $asset" }
          }

          function Get-TagReleases {
            $pages = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp | ConvertFrom-Json -NoEnumerate
            foreach ($page in $pages) { $page | Where-Object { $_.tag_name -ceq $releaseTag } }
          }
          $existing = @(Get-TagReleases | Sort-Object -Property created_at, id -Descending)
          foreach ($duplicate in ($existing | Select-Object -Skip 1)) {
            Write-Host "Deleting duplicate release $($duplicate.id) for $releaseTag; keeping $($existing[0].id)."
            gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/releases/$($duplicate.id)"
          }
          if ($existing.Count -gt 0) {
            gh release edit $releaseTag --title "Phuket Switch $releaseTag" --notes-file CHANGELOG.md --draft=false --prerelease=false
            gh release upload $releaseTag @assets --clobber
          } else {
            gh release create $releaseTag @assets --title "Phuket Switch $releaseTag" --notes-file CHANGELOG.md --verify-tag
          }

          if (@(Get-TagReleases).Count -ne 1) { throw "Expected exactly one release for $releaseTag after publishing." }
          $published = gh release view $releaseTag --json assets | ConvertFrom-Json
          foreach ($asset in $assets) {
            $name = Split-Path -Leaf $asset
            if ($published.assets.name -cnotcontains $name) { throw "Release $releaseTag is missing asset: $name" }
          }
